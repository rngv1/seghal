<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ginni Seghal RNG v1</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    height:100vh;
    background:url("background.jpg") no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
}

.container{
    text-align:center;
}

h1{
    letter-spacing:4px;
}

h2{
    margin:15px 0;
    letter-spacing:3px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,70px);
    gap:10px;
    justify-content:center;
    margin:20px 0;
}

.box{
    width:70px;
    height:70px;
    background:#f2f2f2;
    color:#555;
    font-size:28px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:6px;
}

.timer{
    margin-top:20px;
    letter-spacing:3px;
    font-size:18px;
}

#currentDate{
    margin-top:8px;
    font-size:14px;
    letter-spacing:2px;
}
</style>
</head>

<body>

<div class="container">
    <h1>GINNI SEGHAL</h1>
    <h1>RNG V1</h1>

    <h2>TODAY'S NUMBER</h2>

    <div class="grid" id="grid"></div>

    <div class="timer">
        NEXT NUMBER IN <span id="time">00:00:00</span>
        <div id="currentDate"></div>
    </div>
</div>

<script>
const grid = document.getElementById("grid");
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("currentDate");

// YYYY-MM-DD (same for all devices)
const today = new Date().toISOString().slice(0,10);

// 🔑 Seeded random (deterministic)
function seededRandom(seed){
    let x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
}

// ✅ Same numbers on all devices
function generateNumbers(){
    let nums = [];

    // Convert date to numeric seed
    let seed = Number(today.replaceAll("-", ""));

    // Ensure 0–9 present
    for(let i = 0; i <= 9; i++){
        nums.push(i);
    }

    // Add remaining 6 numbers (seed based)
    for(let i = 0; i < 6; i++){
        seed++;
        nums.push(Math.floor(seededRandom(seed) * 10));
    }

    // Shuffle (seed based)
    for(let i = nums.length - 1; i > 0; i--){
        seed++;
        const j = Math.floor(seededRandom(seed) * (i + 1));
        [nums[i], nums[j]] = [nums[j], nums[i]];
    }

    return nums;
}

function renderGrid(numbers){
    grid.innerHTML="";
    numbers.forEach(n=>{
        const div = document.createElement("div");
        div.className = "box";
        div.innerText = n;
        grid.appendChild(div);
    });
}

// Countdown till midnight
function updateTimer(){
    const now = new Date();
    const midnight = new Date();
    midnight.setHours(24,0,0,0);

    const diff = midnight - now;

    const h = String(Math.floor(diff/3600000)).padStart(2,"0");
    const m = String(Math.floor((diff%3600000)/60000)).padStart(2,"0");
    const s = String(Math.floor((diff%60000)/1000)).padStart(2,"0");

    timeEl.innerText = `${h}:${m}:${s}`;

    if(diff <= 0){
        location.reload();
    }
}

// Run
const numbers = generateNumbers();
renderGrid(numbers);
setInterval(updateTimer,1000);
updateTimer();

// Show date
const d = new Date();
dateEl.innerText =
    String(d.getDate()).padStart(2,"0") + "/" +
    String(d.getMonth()+1).padStart(2,"0") + "/" +
    d.getFullYear();
</script>

</body>
</html>
