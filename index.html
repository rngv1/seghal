<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GINNI SEGHAL RNG V2</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("bg.jpg") no-repeat center center;
      background-size: cover;
    }

    .container {
      max-width: 420px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #ff4fa3;
      text-shadow: 0 0 6px #ff9fcf;
      margin-bottom: 25px;
    }

    .inputs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      justify-items: center;
      margin-bottom: 20px;
    }

    .inputs input {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      border: 4px solid #000;
      background: #ffa45b;
      font-size: 22px;
      text-align: center;
    }

    .inputs input:last-child {
      grid-column: 1 / -1;
      width: 200px;
      height: 70px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      border-radius: 30px;
      border: 4px solid #000;
      background: linear-gradient(90deg, #ff5aa5, #ffb347);
      cursor: pointer;
      margin-top: 10px;
    }

    .results {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      gap: 8px;
    }

    .box {
      flex: 1;
      padding: 12px 0;
      font-size: 20px;
      border-radius: 20px;
      border: 4px solid #000;
      background: linear-gradient(90deg, #ff5aa5, #ffb347);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>GINNI SEGHAL<br>RNG V2</h1>

    <div class="inputs">
      <input type="number" oninput="limit(this)">
      <input type="number" oninput="limit(this)">
      <input type="number" oninput="limit(this)">
      <input type="number" oninput="limit(this)">
      <input type="number" oninput="limit(this)">
    </div>

    <button onclick="getResult()">GET RESULT</button>

    <div class="results">
      <div class="box">--</div>
      <div class="box">--</div>
      <div class="box">--</div>
      <div class="box">--</div>
      <div class="box">--</div>
    </div>
  </div>

<script>
function limit(el) {
  if (el.value.length > 2) el.value = el.value.slice(0, 2);
}

// deterministic seed
function makeSeed(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (h << 5) - h + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

function getResult() {
  const inputs = document.querySelectorAll(".inputs input");
  let values = [];

  for (let i of inputs) {
    if (!i.value) {
      alert("Saare boxes fill kar bhai");
      return;
    }
    values.push(i.value.padStart(2, "0"));
  }

  // 🔐 SAME INPUT => SAME RESULT (all devices)
  const seedStr = values.join("|");
  let seed = makeSeed(seedStr);

  const forbidden = new Set([
    "00","11","22","33","44","55","66","77","88","99",
    "05","14","16","23","27","32","38","41","49","50",
    "61","72","83","94"
  ]);

  let digits = [...Array(10).keys()];
  let attempt = 0;
  let valid = false;

  while (!valid) {
    let local = [...digits];

    for (let i = local.length - 1; i > 0; i--) {
      let j = (seed + attempt + i) % (i + 1);
      [local[i], local[j]] = [local[j], local[i]];
    }

    valid = true;
    for (let i = 0; i < 5; i++) {
      let pair = `${local[i*2]}${local[i*2+1]}`;
      if (forbidden.has(pair)) {
        valid = false;
        break;
      }
    }

    if (valid) {
      const boxes = document.querySelectorAll(".box");
      for (let i = 0; i < 5; i++) {
        boxes[i].innerText = `${local[i*2]}${local[i*2+1]}`;
      }
      return;
    }

    attempt++;
  }
}
</script>
</body>
</html>
