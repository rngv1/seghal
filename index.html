<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GINNI SEGHAL RNG V2</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("bg.jpg") no-repeat center center;
      background-size: cover;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #ff4fa3;
      text-shadow: 0 0 6px #ff9fcf;
      margin-bottom: 30px;
    }

    .inputs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      justify-items: center;
      margin-bottom: 20px;
    }

    .inputs input {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      border: 4px solid #000;
      background: #ffa45b;
      font-size: 22px;
      text-align: center;
      outline: none;
    }

    .inputs input:last-child {
      grid-column: 1 / -1;
      width: 200px;
      height: 70px;
      border-radius: 22px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      border-radius: 30px;
      border: 4px solid #000;
      background: linear-gradient(90deg, #ff5aa5, #ffb347);
      cursor: pointer;
      margin-top: 15px;
    }

    .result {
      margin-top: 18px;
      padding: 16px;
      font-size: 22px;
      border-radius: 30px;
      border: 4px solid #000;
      background: linear-gradient(90deg, #ff5aa5, #ffb347);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>GINNI SEGHAL<br>RNG V2</h1>

    <div class="inputs">
      <input type="number" max="99" oninput="limit(this)">
      <input type="number" max="99" oninput="limit(this)">
      <input type="number" max="99" oninput="limit(this)">
      <input type="number" max="99" oninput="limit(this)">
      <input type="number" max="99" oninput="limit(this)">
    </div>

    <button onclick="getResult()">GET RESULT</button>
    <div class="result" id="output">--</div>
  </div>

  <script>
    function limit(el) {
      if (el.value.length > 2) {
        el.value = el.value.slice(0, 2);
      }
    }

    function getResult() {
      let inputs = document.querySelectorAll(".inputs input");
      let values = [];

      for (let i of inputs) {
        if (!i.value) {
          alert("Saare boxes fill kar bhai");
          return;
        }
        values.push(i.value.padStart(2, "0"));
      }

      // Order independent
      values.sort();

      let seed = values.join("");
      let hash = 0;

      for (let i = 0; i < seed.length; i++) {
        hash = seed.charCodeAt(i) + ((hash << 5) - hash);
      }

      let result = Math.abs(hash % 100);

      // 🔥 FINAL FIX: force 2-digit output
      document.getElementById("output").innerText =
        String(result).padStart(2, "0");
    }
  </script>
</body>
</html>
