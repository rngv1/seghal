<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GINNI SEGHAL RNG V2</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("bg.jpg") no-repeat center center;
      background-size: cover;
    }

    .container {
      max-width: 420px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #ff4fa3;
      text-shadow: 0 0 6px #ff9fcf;
      margin-bottom: 25px;
    }

    .inputs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      justify-items: center;
      margin-bottom: 20px;
    }

    .inputs input {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      border: 4px solid #000;
      background: #ffa45b;
      font-size: 22px;
      text-align: center;
    }

    .inputs input:last-child {
      grid-column: 1 / -1;
      width: 200px;
      height: 70px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      border-radius: 30px;
      border: 4px solid #000;
      background: linear-gradient(90deg, #ff5aa5, #ffb347);
      cursor: pointer;
      margin-top: 10px;
    }

    .results {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      gap: 8px;
    }

    .box {
      flex: 1;
      padding: 12px 0;
      font-size: 20px;
      border-radius: 20px;
      border: 4px solid #000;
      background: linear-gradient(90deg, #ff5aa5, #ffb347);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>GINNI SEGHAL<br>RNG V2</h1>

    <div class="inputs">
      <input type="number" max="99" oninput="limit(this)">
      <input type="number" max="99" oninput="limit(this)">
      <input type="number" max="99" oninput="limit(this)">
      <input type="number" max="99" oninput="limit(this)">
      <input type="number" max="99" oninput="limit(this)">
    </div>

    <button onclick="getResult()">GET RESULT</button>

    <div class="results">
      <div class="box">--</div>
      <div class="box">--</div>
      <div class="box">--</div>
      <div class="box">--</div>
      <div class="box">--</div>
    </div>
  </div>
<script>
function limit(el) {
  if (el.value.length > 2) el.value = el.value.slice(0, 2);
}

function getResult() {
  const inputs = document.querySelectorAll(".inputs input");
  let values = [];

  for (let i of inputs) {
    if (!i.value) {
      alert("Saare boxes fill kar bhai");
      return;
    }
    values.push(i.value.padStart(2, "0"));
  }

  // order independent
  values.sort();
  const seed = values.join("");

  // hash
  let hash = 0;
  for (let c of seed) {
    hash = c.charCodeAt(0) + ((hash << 5) - hash);
  }
  hash = Math.abs(hash);

  const forbidden = new Set([
    "27","72","49","94","50","05","61","16","38","83",
    "11","22","33","44","55","66","77","88","99","00"
  ]);

  const boxes = document.querySelectorAll(".box");

  function isValid(pairs) {
    let diffs = new Set();
    for (let i = 0; i < pairs.length; i++) {
      let [a,b] = pairs[i];
      if (forbidden.has(`${a}${b}`)) return false;

      for (let j = i + 1; j < pairs.length; j++) {
        let [c,d] = pairs[j];
        let x = Math.abs(a - d);
        let y = Math.abs(b - c);
        if (diffs.has(x) || diffs.has(y)) return false;
        diffs.add(x);
        diffs.add(y);
      }
    }
    return true;
  }

  // 🔑 deterministic generation
  let base = [...Array(10).keys()];
  for (let i = base.length - 1; i > 0; i--) {
    let j = (hash + i) % (i + 1);
    [base[i], base[j]] = [base[j], base[i]];
  }

  let pairs = [];
  for (let i = 0; i < 5; i++) {
    pairs.push([base[i * 2], base[i * 2 + 1]]);
  }

  // 🔁 rotate until valid (max 10 rotations – guaranteed end)
  for (let r = 0; r < 10; r++) {
    if (isValid(pairs)) break;
    base.push(base.shift());
    pairs = [];
    for (let i = 0; i < 5; i++) {
      pairs.push([base[i * 2], base[i * 2 + 1]]);
    }
  }

  // output
  for (let i = 0; i < 5; i++) {
    boxes[i].innerText = `${pairs[i][0]}${pairs[i][1]}`;
  }
}
</script>
</body>
</html>
